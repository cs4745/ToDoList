name: Release

# 打 tag（格式 v*，如 v1.2.0）并推送到远端即自动构建并发布
on:
  push:
    tags:
      - 'v*'

# 允许 GITHUB_TOKEN 创建 Release 并上传附件
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        # 直接调用 electron-builder，避免走 npm run build（其内含 cmd 语法 set，在 pwsh 下会失败）
        run: npx electron-builder --win --publish never

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 上传构建产物（portable exe）
          files: dist/*.exe
          # 根据提交历史自动生成 Release 说明
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
