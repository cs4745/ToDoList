name: Release

# 打 tag（格式 v*，如 v1.2.0）并推送到远端即自动构建并发布
on:
  push:
    tags:
      - 'v*'

# 允许 GITHUB_TOKEN 创建 Release 并上传附件
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish to GitHub Releases
        # electron-builder 直接发布：自动上传 portable exe + latest-portable.yml + blockmap，
        # 供应用内 electron-updater 检测并下载新版本。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 -p always
